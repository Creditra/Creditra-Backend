openapi: 3.0.3
info:
  title: Creditra API
  version: 1.0.0
  description: |
    Backend API for Creditra – on-chain credit scoring and risk evaluation.

    ## API versioning
    Canonical routes are under `/api/v1/*`. Unversioned `/api/*` paths remain
    available during a transition window and return `Deprecation`, `Sunset`,
    and `Link: rel="successor-version"` headers. See docs/api-versioning.md.
    Responses under `/api/v1/*` and legacy `/api/*` include `X-API-Version: 1`.

    Browser clients are restricted by a CORS allowlist. Production deployments
    must set `CORS_ORIGINS` to a comma-separated list of exact origins; local
    development falls back to loopback origins when the variable is unset.

    ## Authentication
    Protected endpoints require a valid API key passed via the `X-API-Key` header.
    API keys are configured via the `API_KEYS` environment variable (comma-separated).
    Admin-only operations additionally accept `X-Admin-Api-Key` (env `ADMIN_API_KEY`).

    ## Rate limiting
    Public and authenticated API routes are protected by a **token-bucket** limiter
    with per-route defaults:

    | Route group | Env knobs | Default capacity / window |
    |---|---|---|
    | General (`/api/credit/*`, `/api/risk/wallet/*`, …) | `RATE_LIMIT_MAX_REQUESTS`, `RATE_LIMIT_WINDOW_MS` | 100 / 60s |
    | Risk evaluate (`POST /api/risk/evaluate`) | `RATE_LIMIT_MAX_EVALUATE`, `RATE_LIMIT_WINDOW_MS` | 10 / 60s |

    Every limited response includes:

    - `X-RateLimit-Limit` — bucket capacity
    - `X-RateLimit-Remaining` — whole tokens remaining after the request
    - `X-RateLimit-Reset` — Unix epoch seconds when the bucket is next full
    - `Retry-After` — only on `429`; seconds until at least one token is available

    ### Admin / service bypass
    Requests that present a valid `X-Admin-Api-Key` matching `ADMIN_API_KEY` are
    **not charged** against the bucket. The response still includes rate-limit
    headers and sets `X-RateLimit-Bypass: admin`. When `ADMIN_API_KEY` is unset
    the bypass path is disabled (fail closed).

    Optional shared store: set `RATE_LIMIT_REDIS_URL` for multi-replica counters
    (`RATE_LIMIT_REDIS_FAILURE_MODE=open|closed`, default `open`).

    ## Idempotent POST retries
    POST mutations accept an optional `Idempotency-Key` header. Reusing the same
    key with the same route, principal, and request body returns the original
    non-5xx response instead of executing the mutation again.

    ## Keeping the spec in sync
    - Every new route **must** have a corresponding entry here before merging.
    - Run `npm run validate:spec` in CI to catch YAML/structural errors early.
    - Use path-level `operationId` values as the source of truth for client generation.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Service liveness check
  - name: Credit
    description: Credit line management
  - name: Risk
    description: On-chain risk evaluation
  - name: Webhooks
    description: Draw confirmation webhook management
  - name: Inbound Webhooks
    description: Signed partner webhook ingestion (HMAC + replay protection)
  - name: Reconciliation
    description: Admin control plane for DB-vs-chain reconciliation
  - name: Support
    description: |
      Read-only admin/support tools for safe borrower lookup and troubleshooting.
      All endpoints require `X-Admin-Api-Key`, never mutate state, and redact
      sensitive identifiers (wallet truncation, secret stripping) in responses.

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authenticated endpoints. Required for admin operations.
        Keys are configured via the `API_KEYS` environment variable.
    AdminApiKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Api-Key
      description: |
        Admin / service key. When it matches `ADMIN_API_KEY`, rate limiting is
        bypassed for the request (`X-RateLimit-Bypass: admin`). Also required
        for admin-only routes such as recalibration.

  headers:
    X-RateLimit-Limit:
      description: Token-bucket capacity for this route group
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: Whole tokens remaining after this request
      schema:
        type: integer
        example: 87
    X-RateLimit-Reset:
      description: Unix epoch seconds when the bucket is next full
      schema:
        type: integer
        example: 1718243400
    X-RateLimit-Bypass:
      description: Present when the admin/service bypass applied (`admin`)
      schema:
        type: string
        enum: [admin]
        example: admin
    Retry-After:
      description: Seconds until at least one token is available (429 only)
      schema:
        type: integer
        example: 12

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: creditra-backend

    # ── Credit Line Schemas ──────────────────────────────────────────────────

    CreateCreditLineRequest:
      type: object
      required: [walletAddress, requestedLimit]
      properties:
        walletAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        requestedLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Requested credit limit as a decimal string
          example: "1000.00"
      additionalProperties: false

    UpdateCreditLineRequest:
      type: object
      properties:
        creditLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Updated credit limit
          example: "1500.00"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Credit line status
        expectedVersion:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking guard. When provided, the update only succeeds
            if it equals the stored `version`; otherwise the server returns
            `409 Conflict`. Omit for unconditional (last-write-wins) updates.
          example: 3
      additionalProperties: false

    CreditLineAmountRequest:
      type: object
      required: [walletAddress, amount]
      properties:
        walletAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: Stellar wallet address submitting the action
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        amount:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Action amount as a decimal string
          example: "250.00"
      additionalProperties: false

    CreditLine:
      type: object
      properties:
        id:
          type: string
          description: Unique credit line identifier
          example: "cl_abc123"
        walletAddress:
          type: string
          description: Associated Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        creditLimit:
          type: string
          description: Approved credit limit
          example: "720.00000000"
        currentBalance:
          type: string
          description: Current outstanding balance
          example: "100.00000000"
        availableCredit:
          type: string
          description: Available credit (creditLimit - currentBalance)
          example: "620.00000000"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Current credit line status
        version:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking version, incremented on each update. Pass the
            value you read back as `expectedVersion` on a subsequent update to
            guard against lost writes.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    CreditLinesResponse:
      type: object
      required: [creditLines, pagination]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"
        pagination:
          type: object
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
          required: [total, offset, limit]

    WalletCreditLinesResponse:
      type: object
      required: [creditLines]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"

    CreditLineActionResponse:
      type: object
      required: [line, message]
      properties:
        line:
          $ref: "#/components/schemas/CreditLine"
        message:
          type: string
          example: "Credit line suspended."

    CreditLineTransactionSubmitResponse:
      type: object
      required: [id, walletAddress, amount, txHash, status]
      properties:
        id:
          type: string
          description: Credit line identifier
        walletAddress:
          type: string
          description: Stellar wallet address that submitted the request
        amount:
          type: string
          description: Submitted amount as a decimal string
        txHash:
          type: string
          nullable: true
          description: Submitted transaction hash, or null when queued locally
        status:
          type: string
          enum: [submitted, pending]
          description: Whether the Soroban transaction was submitted or left pending

    # ── Transaction Schemas ──────────────────────────────────────────────────

    Transaction:
      type: object
      required: [id, creditLineId, type, amount, currency, timestamp, metadata]
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
        creditLineId:
          type: string
          description: ID of the credit line this transaction belongs to
        type:
          type: string
          enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Transaction type
        amount:
          type: string
          nullable: true
          description: Transaction amount as a decimal string; null for status changes
          example: "500.00000000"
        currency:
          type: string
          nullable: true
          description: Currency code (e.g. USDC); null for status changes
          example: USDC
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the transaction occurred
        metadata:
          type: object
          additionalProperties: true
          description: Additional context; status changes include an 'action' field
          example:
            action: created

    TransactionHistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transactions, total, page, limit, totalPages]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            total:
              type: integer
              description: Total number of transactions matching the applied filters
            page:
              type: integer
              description: Current page number (1-indexed)
            limit:
              type: integer
              description: Maximum number of transactions per page
            totalPages:
              type: integer
              description: Total number of pages available

    # ── Risk Evaluation Schemas ───────────────────────────────────────────────

    RiskEvaluateRequest:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          description: Stellar wallet address to evaluate
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        forceRefresh:
          type: boolean
          description: Optional hint to bypass cache and recalculate risk
          default: false
      additionalProperties: false

    RiskEvaluateResponse:
      type: object
      required: [walletAddress, riskScore, creditLimit, interestRateBps, message]
      properties:
        walletAddress:
          type: string
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        riskScore:
          type: number
          description: Risk score (0-100)
          example: 72
        creditLimit:
          type: string
          description: Recommended credit limit
          example: "720.00000000"
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
          example: 640
        message:
          type: string
          example: "New risk evaluation completed"

    RiskEvaluateApiResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RiskEvaluateResponse"
        error:
          type: string
          nullable: true

    RiskEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique evaluation identifier
        walletAddress:
          type: string
          description: Evaluated wallet address
        riskScore:
          type: number
          description: Risk score (0-100)
        creditLimit:
          type: string
          description: Recommended credit limit
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
        factors:
          type: object
          additionalProperties: true
          description: Risk evaluation factors and weights
        evaluatedAt:
          type: string
          format: date-time
          description: ISO 8601 evaluation timestamp

    RiskEvaluationHistoryResponse:
      type: object
      required: [evaluations]
      properties:
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/RiskEvaluation"

    # ── Webhook Schemas ───────────────────────────────────────────────────────

    WebhookConfigResponse:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          example: ["https://example.com/webhook"]
        maxRetries:
          type: integer
          example: 3
        initialBackoffMs:
          type: integer
          example: 1000
        backoffMultiplier:
          type: number
          example: 2.0
        timeoutMs:
          type: integer
          example: 10000
        configured:
          type: boolean
          example: true

    WebhookTestResponse:
      type: object
      properties:
        total:
          type: integer
        reachable:
          type: integer
        unreachable:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              reachable:
                type: boolean
              error:
                type: string
                nullable: true

    WebhookHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [active, disabled]
        urls:
          type: integer
          description: Number of configured webhook URLs
        maxRetries:
          type: integer
        timeoutMs:
          type: integer

    InboundWebhookRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
          example: partner.updated
      additionalProperties: true
      description: |
        Free-form partner payload. Prefer including a stable `event` name.
        The raw JSON body is part of the HMAC input — do not re-serialize after signing.

    InboundWebhookAcceptedResponse:
      type: object
      properties:
        data:
          type: object
          required: [accepted, event]
          properties:
            accepted:
              type: boolean
              example: true
            event:
              type: string
              example: partner.updated
        error:
          type: string
          nullable: true

    AdminRecalibrateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Risk model recalibration triggered"

    SupportCreditLineSnapshot:
      type: object
      required:
        - id
        - walletAddress
        - creditLimit
        - availableCredit
        - utilized
        - interestRateBps
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        walletAddress:
          type: string
          description: Truncated Stellar wallet (e.g. GDRXE2...NLRK)
          example: "GDRXE2...NLRK"
        creditLimit:
          type: string
          example: "5000.00"
        availableCredit:
          type: string
        utilized:
          type: string
        interestRateBps:
          type: integer
        status:
          type: string
        version:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SupportTransactionSnapshot:
      type: object
      required:
        - id
        - creditLineId
        - walletAddress
        - amount
        - type
        - status
        - blockchainTxHash
        - createdAt
        - processedAt
      properties:
        id:
          type: string
        creditLineId:
          type: string
        walletAddress:
          type: string
          description: Truncated Stellar wallet
        amount:
          type: string
        type:
          type: string
        status:
          type: string
        blockchainTxHash:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    SupportReconciliationStatus:
      type: object
      required: [workerRunning, queueSize, failedJobs, readOnly]
      properties:
        workerRunning:
          type: boolean
        queueSize:
          type: integer
          minimum: 0
        failedJobs:
          type: integer
          minimum: 0
        readOnly:
          type: boolean
          enum: [true]
          description: Always true — support tools never schedule reconciliation jobs

    SupportBorrowerLookupResponse:
      type: object
      properties:
        data:
          type: object
          required:
            - walletAddress
            - creditLines
            - recentTransactions
            - reconciliation
            - generatedAt
            - found
          properties:
            walletAddress:
              type: string
              description: Truncated wallet used for the lookup
            creditLines:
              type: array
              items:
                $ref: "#/components/schemas/SupportCreditLineSnapshot"
            recentTransactions:
              type: array
              items:
                $ref: "#/components/schemas/SupportTransactionSnapshot"
            reconciliation:
              $ref: "#/components/schemas/SupportReconciliationStatus"
            generatedAt:
              type: string
              format: date-time
            found:
              type: boolean
              description: False when the wallet has no credit lines (still HTTP 200)
        error:
          type: string
          nullable: true

    SupportCreditLineLookupResponse:
      type: object
      properties:
        data:
          type: object
          required:
            - creditLine
            - recentTransactions
            - reconciliation
            - generatedAt
          properties:
            creditLine:
              $ref: "#/components/schemas/SupportCreditLineSnapshot"
            recentTransactions:
              type: array
              items:
                $ref: "#/components/schemas/SupportTransactionSnapshot"
            reconciliation:
              $ref: "#/components/schemas/SupportReconciliationStatus"
            generatedAt:
              type: string
              format: date-time
        error:
          type: string
          nullable: true

    SupportTransactionsResponse:
      type: object
      properties:
        data:
          type: object
          required: [transactions]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/SupportTransactionSnapshot"
        error:
          type: string
          nullable: true

    SupportReconciliationStatusResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SupportReconciliationStatus"
        error:
          type: string
          nullable: true

    ReconciliationTriggerResponse:
      type: object
      properties:
        data:
          type: object
          required: [jobId, message]
          properties:
            jobId:
              type: string
              description: Identifier for the scheduled reconciliation job
            message:
              type: string
              example: Reconciliation job scheduled
        error:
          type: string
          nullable: true

    ReconciliationStatusResponse:
      type: object
      properties:
        data:
          type: object
          required: [workerRunning, queueSize, failedJobs]
          properties:
            workerRunning:
              type: boolean
            queueSize:
              type: integer
              minimum: 0
            failedJobs:
              type: integer
              minimum: 0
        error:
          type: string
          nullable: true

    # ── Error Schemas ─────────────────────────────────────────────────────────

    AdminAuditRecord:
      type: object
      required: [id, actor, action, targetType, targetId, correlationId, createdAt, previousHash, hash]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
          description: SHA-256 fingerprint of the admin actor secret, never the raw key
          example: sha256:2a6f2d8c9e5b1a0c
        action:
          type: string
          example: api_key.issued
        targetType:
          type: string
          example: api_key
        targetId:
          type: string
          nullable: true
        before:
          nullable: true
        after:
          nullable: true
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        previousHash:
          type: string
          nullable: true
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    AdminAuditLogResponse:
      type: object
      properties:
        data:
          type: object
          required: [items, nextCursor, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAuditRecord"
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        id:
          type: string
          description: Present on 404 responses that reference a specific resource

    RateLimitErrorResponse:
      type: object
      required: [data, error, retryAfter]
      properties:
        data:
          nullable: true
          example: null
        error:
          type: string
          example: "Too many requests. Please retry after 12 seconds."
        retryAfter:
          type: integer
          description: Seconds until at least one token is available
          example: 12

    # RFC 7807 problem+json for HTTP 409 conflicts (duplicate resources,
    # version mismatches, invalid state transitions). Content-Type is
    # application/problem+json. Sensitive identifiers (wallets, secrets) are
    # never included in detail/details.
    ConflictProblem:
      type: object
      required: [type, title, status, detail, code, data, error]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI (stable per `code`)
          example: "https://docs.creditra.dev/problems/duplicate_resource"
        title:
          type: string
          example: Conflict
        status:
          type: integer
          enum: [409]
          example: 409
        detail:
          type: string
          description: Human-readable explanation (no sensitive identifiers)
          example: "An open credit line already exists for this wallet. Close it before opening another."
        code:
          type: string
          description: Stable machine-readable code for client branching
          enum:
            - duplicate_resource
            - version_conflict
            - invalid_state_transition
            - unique_constraint_violation
          example: duplicate_resource
        resource:
          type: string
          description: Optional resource kind involved in the conflict
          enum:
            - credit_line
            - risk_evaluation
            - webhook_subscription
            - borrower
            - event
          example: credit_line
        details:
          type: object
          additionalProperties: true
          description: >
            Actionable, non-sensitive context only (field names, status enums).
            Never contains wallet addresses, API keys, or secrets.
          example:
            field: walletAddress
            existingStatus: active
        data:
          nullable: true
          description: Always null on error (legacy envelope compatibility)
        error:
          type: string
          description: Same text as `detail` (legacy envelope compatibility)

    WebhookSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) subscriber URL
          example: "https://example.com/hooks/creditra"
      additionalProperties: false

    WebhookSubscription:
      type: object
      required: [url, createdAt]
      properties:
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: creditra-backend

  # ── Reconciliation Routes ───────────────────────────────────────────────────

  /api/v1/reconciliation/trigger:
    post:
      tags: [Reconciliation]
      operationId: triggerReconciliation
      summary: Schedule a reconciliation job
      description: Admin-gated endpoint that schedules a DB-vs-chain reconciliation job and returns immediately.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reconciliation job scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationTriggerResponse"
              example:
                data:
                  jobId: "reconciliation-1710000000000"
                  message: Reconciliation job scheduled
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to schedule reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/reconciliation/status:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationStatus
      summary: Get reconciliation worker and queue status
      description: Admin-gated endpoint for dashboards and alerts to inspect worker and queue health.
      responses:
        "200":
          description: Reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
              example:
                data:
                  workerRunning: true
                  queueSize: 0
                  failedJobs: 0
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to get reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Support Tools (read-only, admin) ─────────────────────────────────────

  /api/support/borrowers/{walletAddress}:
    get:
      tags: [Support]
      operationId: supportBorrowerLookup
      summary: Safe borrower troubleshooting lookup
      description: |
        Read-only composite view for incident response: credit-line snapshots,
        recent transactions, and reconciliation control-plane status.
        Requires `X-Admin-Api-Key`. Wallet addresses in the response are truncated.
        Never mutates state or schedules jobs.
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            minLength: 56
            maxLength: 56
          description: Full Stellar G-address used for lookup
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Max recent transactions to include
      responses:
        "200":
          description: Borrower support view (found may be false when no lines exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportBorrowerLookupResponse"
              example:
                data:
                  walletAddress: "GDRXE2...NLRK"
                  creditLines: []
                  recentTransactions: []
                  reconciliation:
                    workerRunning: true
                    queueSize: 0
                    failedJobs: 0
                    readOnly: true
                  generatedAt: "2026-01-15T12:00:00.000Z"
                  found: false
                error: null
        "400":
          description: Invalid wallet address or query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin authentication not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/support/credit-lines/{id}:
