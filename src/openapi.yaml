openapi: 3.0.3
info:
  title: Creditra API
  version: 0.1.0
  description: |
    Backend API for Creditra – on-chain credit scoring and risk evaluation.

    Browser clients are restricted by a CORS allowlist. Production deployments
    must set `CORS_ORIGINS` to a comma-separated list of exact origins; local
    development falls back to loopback origins when the variable is unset.

    ## Authentication
    Protected endpoints require a valid API key passed via the `X-API-Key` header.
    API keys are configured via the `API_KEYS` environment variable (comma-separated).

    ## Idempotent POST retries
    POST mutations accept an optional `Idempotency-Key` header. Reusing the same
    key with the same route, principal, and request body returns the original
    non-5xx response instead of executing the mutation again.

    ## Keeping the spec in sync
    - Every new route **must** have a corresponding entry here before merging.
    - Run `npm run validate:spec` in CI to catch YAML/structural errors early.
    - Use path-level `operationId` values as the source of truth for client generation.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Service liveness check
  - name: Credit
    description: Credit line management
  - name: Risk
    description: On-chain risk evaluation
  - name: Webhooks
    description: Draw confirmation webhook management
  - name: Inbound Webhooks
    description: Signed partner webhook ingestion
  - name: Reconciliation
    description: Admin control plane for DB-vs-chain reconciliation
  - name: Admin
    description: Privileged operator controls and audit review

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authenticated endpoints. Required for admin operations.
        Keys are configured via the `API_KEYS` environment variable.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        Conditional request validator. When it matches the current `ETag` of
        the resource representation the server returns `304 Not Modified`
        with an empty body. See docs/etag-caching.md.

  headers:
    ETag:
      description: |
        Opaque strong validator for the response body. Clients SHOULD send
        this value back as `If-None-Match` on subsequent GETs.
      schema:
        type: string
        example: '"dGVzdGhhc2g0123456789abcd"'
    CacheControlPrivateRevalidate:
      description: |
        Always `private, must-revalidate` on ETag-backed reads — not shared
        across tenants; clients must revalidate before reuse.
      schema:
        type: string
        example: private, must-revalidate

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: creditra-backend

    # ── Credit Line Schemas ──────────────────────────────────────────────────

    CreateCreditLineRequest:
      type: object
      required: [walletAddress, requestedLimit]
      properties:
        walletAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        requestedLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Requested credit limit as a decimal string
          example: "1000.00"
      additionalProperties: false

    UpdateCreditLineRequest:
      type: object
      properties:
        creditLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Updated credit limit
          example: "1500.00"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Credit line status
        expectedVersion:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking guard. When provided, the update only succeeds
            if it equals the stored `version`; otherwise the server returns
            `409 Conflict`. Omit for unconditional (last-write-wins) updates.
          example: 3
      additionalProperties: false

    CreditLineAmountRequest:
      type: object
      required: [walletAddress, amount]
      properties:
        walletAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: Stellar wallet address submitting the action
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        amount:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Action amount as a decimal string
          example: "250.00"
      additionalProperties: false

    CreditLine:
      type: object
      properties:
        id:
          type: string
          description: Unique credit line identifier
          example: "cl_abc123"
        walletAddress:
          type: string
          description: Associated Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        creditLimit:
          type: string
          description: Approved credit limit
          example: "720.00000000"
        currentBalance:
          type: string
          description: Current outstanding balance
          example: "100.00000000"
        availableCredit:
          type: string
          description: Available credit (creditLimit - currentBalance)
          example: "620.00000000"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Current credit line status
        version:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking version, incremented on each update. Pass the
            value you read back as `expectedVersion` on a subsequent update to
            guard against lost writes.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    CreditLinesResponse:
      type: object
      required: [creditLines, pagination]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"
        pagination:
          type: object
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
          required: [total, offset, limit]

    WalletCreditLinesResponse:
      type: object
      required: [creditLines]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"

    CreditLineActionResponse:
      type: object
      required: [line, message]
      properties:
        line:
          $ref: "#/components/schemas/CreditLine"
        message:
          type: string
          example: "Credit line suspended."

    CreditLineTransactionSubmitResponse:
      type: object
      required: [id, walletAddress, amount, txHash, status]
      properties:
        id:
          type: string
          description: Credit line identifier
        walletAddress:
          type: string
          description: Stellar wallet address that submitted the request
        amount:
          type: string
          description: Submitted amount as a decimal string
        txHash:
          type: string
          nullable: true
          description: Submitted transaction hash, or null when queued locally
        status:
          type: string
          enum: [submitted, pending]
          description: Whether the Soroban transaction was submitted or left pending

    # ── Transaction Schemas ──────────────────────────────────────────────────

    Transaction:
      type: object
      required: [id, creditLineId, type, amount, currency, timestamp, metadata]
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
        creditLineId:
          type: string
          description: ID of the credit line this transaction belongs to
        type:
          type: string
          enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Transaction type
        amount:
          type: string
          nullable: true
          description: Transaction amount as a decimal string; null for status changes
          example: "500.00000000"
        currency:
          type: string
          nullable: true
          description: Currency code (e.g. USDC); null for status changes
          example: USDC
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the transaction occurred
        metadata:
          type: object
          additionalProperties: true
          description: Additional context; status changes include an 'action' field
          example:
            action: created

    TransactionHistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transactions, total, page, limit, totalPages]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            total:
              type: integer
              description: Total number of transactions matching the applied filters
            page:
              type: integer
              description: Current page number (1-indexed)
            limit:
              type: integer
              description: Maximum number of transactions per page
            totalPages:
              type: integer
              description: Total number of pages available

    # ── Risk Evaluation Schemas ───────────────────────────────────────────────

    RiskEvaluateRequest:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          description: Stellar wallet address to evaluate
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        forceRefresh:
          type: boolean
          description: Optional hint to bypass cache and recalculate risk
          default: false
      additionalProperties: false

    RiskEvaluateResponse:
      type: object
      required: [walletAddress, riskScore, creditLimit, interestRateBps, message]
      properties:
        walletAddress:
          type: string
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        riskScore:
          type: number
          description: Risk score (0-100)
          example: 72
        creditLimit:
          type: string
          description: Recommended credit limit
          example: "720.00000000"
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
          example: 640
        message:
          type: string
          example: "New risk evaluation completed"

    RiskEvaluateApiResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RiskEvaluateResponse"
        error:
          type: string
          nullable: true

    RiskEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique evaluation identifier
        walletAddress:
          type: string
          description: Evaluated wallet address
        riskScore:
          type: number
          description: Risk score (0-100)
        creditLimit:
          type: string
          description: Recommended credit limit
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
        factors:
          type: object
          additionalProperties: true
          description: Risk evaluation factors and weights
        evaluatedAt:
          type: string
          format: date-time
          description: ISO 8601 evaluation timestamp

    RiskEvaluationHistoryResponse:
      type: object
      required: [evaluations]
      properties:
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/RiskEvaluation"

    # ── Webhook Schemas ───────────────────────────────────────────────────────

    WebhookConfigResponse:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          example: ["https://example.com/webhook"]
        maxRetries:
          type: integer
          example: 3
        initialBackoffMs:
          type: integer
          example: 1000
        backoffMultiplier:
          type: number
          example: 2.0
        timeoutMs:
          type: integer
          example: 10000
        configured:
          type: boolean
          example: true

    WebhookTestResponse:
      type: object
      properties:
        total:
          type: integer
        reachable:
          type: integer
        unreachable:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              reachable:
                type: boolean
              error:
                type: string
                nullable: true

    WebhookHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [active, disabled]
        urls:
          type: integer
          description: Number of configured webhook URLs
        maxRetries:
          type: integer
        timeoutMs:
          type: integer

    InboundWebhookRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
          example: partner.updated
      additionalProperties: true

    InboundWebhookAcceptedResponse:
      type: object
      properties:
        data:
          type: object
          required: [accepted, event]
          properties:
            accepted:
              type: boolean
              example: true
            event:
              type: string
              example: partner.updated
        error:
          type: string
          nullable: true

    AdminRecalibrateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Risk model recalibration triggered"

    ReconciliationTriggerResponse:
      type: object
      properties:
        data:
          type: object
          required: [jobId, message]
          properties:
            jobId:
              type: string
              description: Identifier for the scheduled reconciliation job
            message:
              type: string
              example: Reconciliation job scheduled
        error:
          type: string
          nullable: true

    ReconciliationStatusResponse:
      type: object
      properties:
        data:
          type: object
          required: [workerRunning, queueSize, failedJobs]
          properties:
            workerRunning:
              type: boolean
            queueSize:
              type: integer
              minimum: 0
            failedJobs:
              type: integer
              minimum: 0
        error:
          type: string
          nullable: true

    # ── Error Schemas ─────────────────────────────────────────────────────────

    AdminAuditRecord:
      type: object
      required: [id, actor, action, targetType, targetId, correlationId, createdAt, previousHash, hash]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
          description: SHA-256 fingerprint of the admin actor secret, never the raw key
          example: sha256:2a6f2d8c9e5b1a0c
        action:
          type: string
          example: api_key.issued
        targetType:
          type: string
          example: api_key
        targetId:
          type: string
          nullable: true
        before:
          nullable: true
        after:
          nullable: true
        correlationId:
          type: string
        createdAt:
          type: string
          format: date-time
        previousHash:
          type: string
          nullable: true
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"

    AdminAuditLogResponse:
      type: object
      properties:
        data:
          type: object
          required: [items, nextCursor, hasMore]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AdminAuditRecord"
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        id:
          type: string
          description: Present on 404 responses that reference a specific resource

    RateLimitErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Too many requests"

    # RFC 7807 problem+json for HTTP 409 conflicts (duplicate resources,
    # version mismatches, invalid state transitions). Content-Type is
    # application/problem+json. Sensitive identifiers (wallets, secrets) are
    # never included in detail/details.
    ConflictProblem:
      type: object
      required: [type, title, status, detail, code, data, error]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI (stable per `code`)
          example: "https://docs.creditra.dev/problems/duplicate_resource"
        title:
          type: string
          example: Conflict
        status:
          type: integer
          enum: [409]
          example: 409
        detail:
          type: string
          description: Human-readable explanation (no sensitive identifiers)
          example: "An open credit line already exists for this wallet. Close it before opening another."
        code:
          type: string
          description: Stable machine-readable code for client branching
          enum:
            - duplicate_resource
            - version_conflict
            - invalid_state_transition
            - unique_constraint_violation
          example: duplicate_resource
        resource:
          type: string
          description: Optional resource kind involved in the conflict
          enum:
            - credit_line
            - risk_evaluation
            - webhook_subscription
            - borrower
            - event
          example: credit_line
        details:
          type: object
          additionalProperties: true
          description: >
            Actionable, non-sensitive context only (field names, status enums).
            Never contains wallet addresses, API keys, or secrets.
          example:
            field: walletAddress
            existingStatus: active
        data:
          nullable: true
          description: Always null on error (legacy envelope compatibility)
        error:
          type: string
          description: Same text as `detail` (legacy envelope compatibility)

    WebhookSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) subscriber URL
          example: "https://example.com/hooks/creditra"
      additionalProperties: false

    WebhookSubscription:
      type: object
      required: [url, createdAt]
      properties:
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: creditra-backend

  # ── Reconciliation Routes ───────────────────────────────────────────────────

  /api/admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAdminAuditLogs
      summary: List append-only admin audit records
      description: Returns newest-first audit records for privileged operator actions. Requires `X-Admin-Api-Key`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Admin audit records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogResponse"
        "400":
          description: Invalid pagination or filter parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reconciliation/trigger:
    post:
      tags: [Reconciliation]
      operationId: triggerReconciliation
      summary: Schedule a reconciliation job
      description: Admin-gated endpoint that schedules a DB-vs-chain reconciliation job and returns immediately.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Reconciliation job scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationTriggerResponse"
              example:
                data:
                  jobId: "reconciliation-1710000000000"
                  message: Reconciliation job scheduled
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to schedule reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reconciliation/status:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationStatus
      summary: Get reconciliation worker and queue status
      description: Admin-gated endpoint for dashboards and alerts to inspect worker and queue health.
      responses:
        "200":
          description: Reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
              example:
                data:
                  workerRunning: true
                  queueSize: 0
                  failedJobs: 0
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to get reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Credit Lines Routes ─────────────────────────────────────────────────────

  /api/credit/lines:
    get:
      tags: [Credit]
      operationId: listCreditLines
      summary: List all credit lines
      security: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of credit lines per page
      responses:
        "200":
          description: Array of credit lines (may be empty)
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window
              schema:
                type: integer
                example: 100
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema:
                type: integer
                example: 95
            X-RateLimit-Reset:
              description: Unix timestamp when the rate limit window resets
              schema:
                type: integer
                example: 1700000060
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLinesResponse"
              example:
                creditLines: []
                pagination:
                  total: 0
                  offset: 0
                  limit: 100
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 47
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    post:
      tags: [Credit]
      operationId: createCreditLine
      summary: Create a new credit line
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditLineRequest"
            example:
              walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
              requestedLimit: "1000.00"
      responses:
        "201":
          description: Credit line created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Duplicate open credit line for this wallet. Close the existing open
            line before opening another. Response is RFC 7807 problem+json with
            stable `code` `duplicate_resource` (or `unique_constraint_violation`).
            Sensitive identifiers are never included in `detail`/`details`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/duplicate_resource"
                title: Conflict
                status: 409
                detail: "An open credit line already exists for this wallet. Close it before opening another."
                code: duplicate_resource
                resource: credit_line
                details:
                  field: walletAddress
                  existingStatus: active
                data: null
                error: "An open credit line already exists for this wallet. Close it before opening another."

  /api/credit/lines/{id}:
    get:
      tags: [Credit]
      operationId: getCreditLineById
      summary: Get a credit line by ID
      description: |
        Returns a single credit line. Supports conditional GET via `ETag` /
        `If-None-Match` (see docs/etag-caching.md). The ETag is a content hash
        of the response envelope and changes whenever the line's state changes.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Credit line found
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "304":
          description: |
            Not Modified — the representation matching `If-None-Match` is still
            current. Body is empty; reuse the previously cached payload.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Credit line not found
                id: "abc123"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    put:
      tags: [Credit]
      operationId: updateCreditLine
      summary: Update a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCreditLineRequest"
            example:
              creditLimit: "1500.00"
              interestRateBps: 640
              status: active
              expectedVersion: 3
      responses:
        "200":
          description: Credit line updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Optimistic-locking conflict. The supplied `expectedVersion` did not
            match the stored `version`, meaning a concurrent update won the
            race. Re-read the credit line to get the current `version` and
            retry the update with it. Body is RFC 7807 problem+json with
            `code: version_conflict`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/version_conflict"
                title: Conflict
                status: 409
                detail: "Credit line was modified concurrently (expected version 1, found 2). Re-read and retry."
                code: version_conflict
                resource: credit_line
                details:
                  expectedVersion: 1
                  actualVersion: 2
                data: null
                error: "Credit line was modified concurrently (expected version 1, found 2). Re-read and retry."

    delete:
      tags: [Credit]
      operationId: deleteCreditLine
      summary: Delete a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "204":
          description: Credit line deleted successfully
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit/lines/{id}/transactions:
    get:
      tags: [Credit]
      operationId: getCreditLineTransactions
      summary: List transaction history for a credit line
      description: |
        Returns a paginated list of transactions for the given credit line.
        Supports optional filtering by transaction type and date range.

        Conditional GET is supported via `ETag` / `If-None-Match`. The ETag
        covers the filtered and paginated slice — different query strings
        produce different validators. See docs/etag-caching.md.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Filter by transaction type
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or after this ISO 8601 timestamp (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or before this ISO 8601 timestamp (inclusive)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of transactions per page
      responses:
        "200":
          description: Paginated list of transactions
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistoryResponse"
              example:
                data:
                  transactions:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      creditLineId: "line-abc"
                      type: status_change
                      amount: null
                      currency: null
                      timestamp: "2024-01-15T10:00:00.000Z"
                      metadata:
                        action: created
                  total: 1
                  page: 1
                  limit: 20
                  totalPages: 1
        "304":
          description: |
            Not Modified — transaction slice matching `If-None-Match` is still
            current. Body is empty.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid type filter. Must be one of: borrow, repay, interest_accrual, fee, status_change."
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

