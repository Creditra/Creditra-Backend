                data:
                  workerRunning: true
                  queueSize: 0
                  failedJobs: 0
                  readOnly: true
                error: null
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin authentication not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Credit Lines Routes ─────────────────────────────────────────────────────

  /api/v1/credit/lines:
    get:
      tags: [Credit]
      operationId: listCreditLines
      summary: List all credit lines
      description: |
        Supports two pagination modes:
        - **Cursor (preferred):** pass `cursor` (empty for the first page). Response
          pagination is `{ limit, nextCursor, hasMore }` with opaque cursors.
        - **Offset (legacy):** pass `offset` / `limit` without `cursor`.
        See `docs/cursor-pagination.md`.
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque cursor from a previous response. Presence (even empty)
            enables cursor pagination mode.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset (legacy mode; ignored when cursor is present)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of credit lines per page (validated by creditLinesQuerySchema)
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            When present (including empty string), switches to cursor pagination.
            Pass `nextCursor` from the previous page for subsequent pages.
      responses:
        "200":
          description: |
            Offset mode returns `{ data: { creditLines, pagination }, error: null }`.
            Cursor mode returns an unenveloped `{ creditLines, pagination }` body
            (see docs/cursor-pagination.md).
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Bypass:
              $ref: "#/components/headers/X-RateLimit-Bypass"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLinesResponse"
              examples:
                offsetMode:
                  summary: Legacy offset pagination
                  value:
                    data:
                      creditLines: []
                      pagination:
                        total: 0
                        offset: 0
                        limit: 100
                    error: null
                cursorMode:
                  summary: Standard cursor pagination
                  value:
                    creditLines: []
                    pagination:
                      limit: 25
                      nextCursor: null
                      hasMore: false
        "400":
          description: Invalid query parameter (Zod validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Token bucket empty — rate limit exceeded
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    post:
      tags: [Credit]
      operationId: createCreditLine
      summary: Create a new credit line
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditLineRequest"
            example:
              walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
              requestedLimit: "1000.00"
      responses:
        "201":
          description: Credit line created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Duplicate open credit line for this wallet. Close the existing open
            line before opening another. Response is RFC 7807 problem+json with
            stable `code` `duplicate_resource` (or `unique_constraint_violation`).
            Sensitive identifiers are never included in `detail`/`details`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/duplicate_resource"
                title: Conflict
                status: 409
                detail: "An open credit line already exists for this wallet. Close it before opening another."
                code: duplicate_resource
                resource: credit_line
                details:
                  field: walletAddress
                  existingStatus: active
                data: null
                error: "An open credit line already exists for this wallet. Close it before opening another."

  /api/v1/credit/lines/{id}:
    get:
      tags: [Credit]
      operationId: getCreditLineById
      summary: Get a credit line by ID
      description: |
        Returns a single credit line. Supports conditional GET via `ETag` /
        `If-None-Match` (see docs/etag-caching.md). The ETag is a content hash
        of the response envelope and changes whenever the line's state changes.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Credit line found
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Bypass:
              $ref: "#/components/headers/X-RateLimit-Bypass"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "304":
          description: |
            Not Modified — the representation matching `If-None-Match` is still
            current. Body is empty; reuse the previously cached payload.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Credit line not found
                id: "abc123"
        "429":
          description: Token bucket empty — rate limit exceeded
          headers:
            Retry-After:
              $ref: "#/components/headers/Retry-After"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    put:
      tags: [Credit]
      operationId: updateCreditLine
      summary: Update a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCreditLineRequest"
            example:
              creditLimit: "1500.00"
              interestRateBps: 640
              status: active
              expectedVersion: 3
      responses:
        "200":
          description: Credit line updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Optimistic-locking conflict. The supplied `expectedVersion` did not
            match the stored `version`, meaning a concurrent update won the
            race. Re-read the credit line to get the current `version` and
            retry the update with it. Body is RFC 7807 problem+json with
            `code: version_conflict`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/version_conflict"
                title: Conflict
                status: 409
                detail: "Credit line was modified concurrently (expected version 1, found 2). Re-read and retry."
                code: version_conflict
                resource: credit_line
                details:
                  expectedVersion: 1
                  actualVersion: 2
                data: null
                error: "Credit line was modified concurrently (expected version 1, found 2). Re-read and retry."

    delete:
      tags: [Credit]
      operationId: deleteCreditLine
      summary: Delete a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "204":
          description: Credit line deleted successfully
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/credit/lines/{id}/transactions:
    get:
      tags: [Credit]
      operationId: getCreditLineTransactions
      summary: List transaction history for a credit line
      description: |
        Returns a paginated list of transactions for the given credit line.
        Supports optional filtering by transaction type and date range.

        Conditional GET is supported via `ETag` / `If-None-Match`. The ETag
        covers the filtered and paginated slice — different query strings
        produce different validators. See docs/etag-caching.md.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Filter by transaction type
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or after this ISO 8601 timestamp (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or before this ISO 8601 timestamp (inclusive)
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >
            Opaque cursor. Presence enables standard cursor pagination
            (`{ transactions, pagination: { limit, nextCursor, hasMore } }`).
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed, legacy mode)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of transactions per page
      responses:
        "200":
          description: Paginated list of transactions
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistoryResponse"
              examples:
                legacyPage:
                  summary: Legacy page/limit
                  value:
                    data:
                      transactions:
                        - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                          creditLineId: "line-abc"
                          type: status_change
                          amount: null
                          currency: null
                          timestamp: "2024-01-15T10:00:00.000Z"
                          metadata:
                            action: created
                      total: 1
                      page: 1
                      limit: 20
                      totalPages: 1
                    error: null
                cursorMode:
                  summary: Standard cursor pagination
                  value:
                    data:
                      transactions: []
                      pagination:
                        limit: 20
                        nextCursor: null
                        hasMore: false
                    error: null
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid type filter. Must be one of: borrow, repay, interest_accrual, fee, status_change."
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/credit/lines/{id}/suspend:
    post:
      tags: [Credit]
      operationId: suspendCreditLine
      summary: Suspend a credit line
      description: |
        Suspends the specified credit line, preventing further draws.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "200":
          description: Credit line suspended successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLineActionResponse"
        "401":
          description: API key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Forbidden
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Invalid state transition (e.g. suspend of already suspended/closed).
            RFC 7807 problem+json with `code: invalid_state_transition`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"

  /api/v1/credit/lines/{id}/close:
    post:
      tags: [Credit]
      operationId: closeCreditLine
      summary: Close a credit line
      description: |
        Closes the specified credit line permanently.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "200":
          description: Credit line closed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLineActionResponse"
        "401":
          description: API key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Forbidden
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Invalid state transition (e.g. close of already closed).
            RFC 7807 problem+json with `code: invalid_state_transition`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"

  /api/v1/credit/wallet/{walletAddress}/lines:
    get:
      tags: [Credit]
      operationId: getCreditLinesByWallet
      summary: Get credit lines for a specific wallet
      security: []
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
          description: Stellar wallet address
      responses:
        "200":
          description: Credit lines for the wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCreditLinesResponse"
              example:
                creditLines:
                  - id: "cl_abc123"
                    walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
                    creditLimit: "720.00000000"
                    currentBalance: "100.00000000"
                    availableCredit: "620.00000000"
                    interestRateBps: 640
                    status: active
                    createdAt: "2024-01-15T10:00:00.000Z"
                    updatedAt: "2024-01-15T10:00:00.000Z"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Risk Evaluation Routes ──────────────────────────────────────────────────

  /api/v1/risk/evaluate:
    post:
      tags: [Risk]
      operationId: evaluateRisk
      summary: Evaluate on-chain risk for a wallet
      description: |
        Performs a fresh risk evaluation for the given Stellar wallet address.
        Rate limited: default 10 requests per minute per IP address.
        Configure via RATE_LIMIT_MAX_EVALUATE and RATE_LIMIT_WINDOW_MS env vars.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskEvaluateRequest"
            example:
              walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
              forceRefresh: false
      responses:
        "200":
          description: Risk evaluation result
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
            X-RateLimit-Bypass:
              $ref: "#/components/headers/X-RateLimit-Bypass"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateApiResponse"
              example:
                data:
                  walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
                  riskScore: 72
                  creditLimit: "720.00000000"
                  interestRateBps: 640
                  message: New risk evaluation completed
                error: null
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Validation failed
        "413":
          description: Request body exceeds the per-endpoint size limit (default 100 KiB)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PayloadTooLargeProblem"
              example:
                type: https://httpstatuses.com/413
                title: Payload Too Large
                status: 413
                detail: Payload Too Large. Request body exceeds the maximum size of 100kb for this endpoint.
                limit: 102400
                limitLabel: 100kb
                data: null
                error: Payload Too Large. Request body exceeds the maximum size of 100kb for this endpoint.
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                data: null
                error: Content-Type must be application/json
        "409":
          description: >
            Unique-constraint race while persisting an evaluation.
            RFC 7807 problem+json (`unique_constraint_violation` / `duplicate_resource`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"

  /api/risk/evaluations:
    post:
      tags: [Risk]
      operationId: createRiskEvaluation
      summary: Create a risk evaluation (conflicts if unexpired exists)
      description: |
        Explicit create path. Returns 409 when a valid (unexpired) evaluation
        already exists for the wallet unless `forceRefresh` is true.
        Sensitive identifiers are never included in conflict details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskEvaluateRequest"
      responses:
        "201":
          description: New risk evaluation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateApiResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Unexpired risk evaluation already exists for this wallet.
            Use forceRefresh to replace. problem+json `code: duplicate_resource`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/duplicate_resource"
                title: Conflict
                status: 409
                detail: "A valid risk evaluation already exists for this wallet. Pass forceRefresh to replace it."
                code: duplicate_resource
                resource: risk_evaluation
                details:
                  field: walletAddress
                  reason: unexpired_evaluation
                data: null
                error: "A valid risk evaluation already exists for this wallet. Pass forceRefresh to replace it."

  /api/webhooks/subscriptions:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List runtime webhook subscriptions
      security: []
      responses:
        "200":
          description: Runtime subscriptions (env URLs are on GET /config)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subscriptions:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookSubscription"
                  error:
                    nullable: true
    post:
      tags: [Webhooks]
      operationId: registerWebhookSubscription
      summary: Register a runtime webhook subscription
      description: |
        Adds a subscriber URL at runtime. Duplicate URLs (including those from
        `WEBHOOK_URLS`) return 409 problem+json. Full URL values that may carry
        secrets are not echoed in conflict details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionRequest"
      responses:
        "201":
          description: Subscription registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookSubscription"
                  error:
                    nullable: true
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Subscription URL already registered. problem+json
            `code: duplicate_resource`, `resource: webhook_subscription`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/duplicate_resource"
                title: Conflict
                status: 409
                detail: "A webhook subscription for this endpoint already exists."
                code: duplicate_resource
                resource: webhook_subscription
                details:
                  field: url
                  reason: duplicate_url
                data: null
                error: "A webhook subscription for this endpoint already exists."

  /api/risk/admin/recalibrate:
    post:
      tags: [Risk]
      operationId: recalibrateRiskModel
      summary: Trigger risk model recalibration
      description: Admin-gated endpoint that triggers risk model recalibration.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Risk model recalibration triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecalibrateResponse"
        "401":
          description: API key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/config:
    get:
      tags: [Webhooks]
      operationId: getWebhookConfig
      summary: Get webhook configuration
      description: Returns the current webhook configuration (excluding sensitive data)
      security: []
      responses:
        "200":
          description: Webhook configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookConfigResponse"
              example:
                urls: ["https://example.com/webhook"]
                maxRetries: 3
                initialBackoffMs: 1000
                backoffMultiplier: 2.0
                timeoutMs: 10000
                configured: true

  /api/v1/webhooks/test:
    post:
      tags: [Webhooks]
      operationId: testWebhooks
      summary: Test webhook connectivity
      description: Sends a test payload to all configured webhook endpoints
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResponse"
              example:
                total: 2
                reachable: 1
                unreachable: 1
                results:
                  - url: "https://example.com/webhook"
                    reachable: true
                  - url: "https://test.com/hook"
                    reachable: false
                    error: "Connection refused"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/webhooks/health:
    get:
      tags: [Webhooks]
      operationId: getWebhookHealth
      summary: Webhook service health check
      description: Returns the health status of the webhook service
      security: []
      responses:
        "200":
          description: Webhook service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookHealthResponse"
              example:
                status: active
                urls: 2
                maxRetries: 3
                timeoutMs: 10000

  /api/webhooks/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook delivery records (cursor pagination)
      description: |
        Returns outbound delivery attempts using the standard cursor pagination
        model. Sort order is `updatedAt DESC` with a stable `drawId::url` tie-break.
        Cursors are opaque; pass `nextCursor` back verbatim.
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous page (empty/omit for first page)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [delivered, failed, dead_letter]
          description: Optional status filter
      responses:
        "200":
          description: Cursor page of delivery records
          content:
            application/json:
              schema:
                type: object
                required: [data, error]
                properties:
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/WebhookDeliveryRecord"
                      pagination:
                        $ref: "#/components/schemas/CursorPagination"
                  error:
                    type: string
                    nullable: true
              example:
                data:
                  items: []
                  pagination:
                    limit: 25
                    nextCursor: null
                    hasMore: false
                error: null
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/risk/evaluations/{id}:
    get:
      tags: [Risk]
      operationId: getRiskEvaluationById
      summary: Fetch a stored risk evaluation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Risk evaluation identifier
      responses:
        "200":
          description: Risk evaluation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluation"
        "404":
          description: Risk evaluation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Risk evaluation not found
                id: "abc123"

  /api/v1/risk/wallet/{walletAddress}/latest:
    get:
      tags: [Risk]
      operationId: getLatestRiskEvaluation
      summary: Get the latest risk evaluation for a wallet
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: Stellar public key
      responses:
        "200":
          description: Risk evaluation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateResponse"
        "400":
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No risk evaluation found for wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/risk/wallet/{walletAddress}/history:
    get:
      tags: [Risk]
      operationId: getRiskEvaluationHistory
      summary: Get risk evaluation history for a wallet
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: Stellar public key
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Pagination limit
      responses:
        "200":
          description: Array of risk evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskEvaluation"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Compliance Export Routes (admin) ────────────────────────────────────────

  /api/admin/exports/credit-lines:
    get:
      tags: [Compliance Exports]
      operationId: exportCreditLines
      summary: Export credit lines (CSV/JSON)
      description: |
        Admin-only streaming export of credit lines for a required date range.
        Max range 90 days; max 5000 rows per request. See docs/COMPLIANCE_EXPORTS.md.
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound (ISO-8601 UTC)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound (ISO-8601 UTC); span ≤ 90 days
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suspended, closed, pending]
        - name: walletAddress
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Export payload (JSON envelope or CSV attachment)
          headers:
            X-Export-Count:
              schema: { type: integer }
            X-Export-Limit:
              schema: { type: integer }
            X-Export-Offset:
              schema: { type: integer }
            X-Export-Truncated:
              schema: { type: string, enum: [true, false] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceExportResponse"
            text/csv:
              schema:
                type: string
        "400":
          description: Validation failed (missing range, span too large, bad limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid admin key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Export rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
        "503":
          description: Admin authentication not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/exports/transactions:
    get:
      tags: [Compliance Exports]
      operationId: exportTransactions
      summary: Export transactions (CSV/JSON)
      description: |
        Admin-only streaming export of transactions for a required date range.
        Max range 90 days; max 5000 rows per request.
