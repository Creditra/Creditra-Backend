      description: |
        Read-only recent transaction list for a credit line. Requires
        `X-Admin-Api-Key`. Wallet addresses are truncated in the payload.
      security:
        - AdminApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
