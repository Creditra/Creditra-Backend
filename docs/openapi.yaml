openapi: 3.0.3
info:
  title: Creditra API
  version: 0.1.0
  description: |
    Backend API for Creditra – on-chain credit scoring and risk evaluation.

    Browser clients are restricted by a CORS allowlist. Production deployments
    must set `CORS_ORIGINS` to a comma-separated list of exact origins; local
    development falls back to loopback origins when the variable is unset.

    ## Authentication
    Protected endpoints require a valid API key passed via the `X-API-Key` header.
    API keys are configured via the `API_KEYS` environment variable (comma-separated).

    ## Keeping the spec in sync
    - **Zod schemas** in `src/schemas/` are the runtime source of truth for request
      and response validation. This OpenAPI document should mirror those schemas.
    - Every new route **must** have a corresponding entry here before merging.
    - Run `npm run validate:spec` in CI to catch YAML/structural errors early.
    - Use path-level `operationId` values as the source of truth for client generation.
    - See `docs/json-schema-validation.md` for request/response validation policy.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Service liveness check
  - name: Credit
    description: Credit line management
  - name: Risk
    description: On-chain risk evaluation
  - name: Webhooks
    description: Draw confirmation webhook management
  - name: Reconciliation
    description: Admin control plane for DB-vs-chain reconciliation

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authenticated endpoints. Required for admin operations.
        Keys are configured via the `API_KEYS` environment variable.

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        Conditional request validator. When it matches the current `ETag` of
        the resource representation the server returns `304 Not Modified`
        with an empty body. See docs/etag-caching.md.

  headers:
    ETag:
      description: |
        Opaque strong validator for the response body. Clients SHOULD send
        this value back as `If-None-Match` on subsequent GETs.
      schema:
        type: string
        example: '"dGVzdGhhc2g0123456789abcd"'
    CacheControlPrivateRevalidate:
      description: |
        Always `private, must-revalidate` on ETag-backed reads — not shared
        across tenants; clients must revalidate before reuse.
      schema:
        type: string
        example: private, must-revalidate

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: creditra-backend

    # ── Credit Line Schemas ──────────────────────────────────────────────────

    CreateCreditLineRequest:
      type: object
      required: [walletAddress, requestedLimit]
      properties:
        walletAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        requestedLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Requested credit limit as a decimal string
          example: "1000.00"
      additionalProperties: false

    UpdateCreditLineRequest:
      type: object
      description: |
        Partial update body (updateCreditLineSchema). At least one of the
        updatable fields must be present. Unknown keys are rejected.
      properties:
        creditLimit:
          type: string
          pattern: "^\\d+(\\.\\d+)?$"
          description: Updated credit limit
          example: "1500.00"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Credit line status
        expectedVersion:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking guard. When provided, the update only succeeds
            if it equals the stored `version`; otherwise the server returns
            `409 Conflict`. Omit for unconditional (last-write-wins) updates.
          example: 3
      additionalProperties: false

    CreditLine:
      type: object
      properties:
        id:
          type: string
          description: Unique credit line identifier
          example: "cl_abc123"
        walletAddress:
          type: string
          description: Associated Stellar wallet address
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        creditLimit:
          type: string
          description: Approved credit limit
          example: "720.00000000"
        currentBalance:
          type: string
          description: Current outstanding balance
          example: "100.00000000"
        availableCredit:
          type: string
          description: Available credit (creditLimit - currentBalance)
          example: "620.00000000"
        interestRateBps:
          type: number
          description: Interest rate in basis points
          example: 640
        status:
          type: string
          enum: [active, suspended, closed]
          description: Current credit line status
        version:
          type: integer
          minimum: 1
          description: >
            Optimistic-locking version, incremented on each update. Pass the
            value you read back as `expectedVersion` on a subsequent update to
            guard against lost writes.
          example: 1
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp

    CreditLinesResponse:
      type: object
      required: [creditLines, pagination]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"
        pagination:
          type: object
          properties:
            total:
              type: integer
            offset:
              type: integer
            limit:
              type: integer
          required: [total, offset, limit]

    WalletCreditLinesResponse:
      type: object
      required: [creditLines]
      properties:
        creditLines:
          type: array
          items:
            $ref: "#/components/schemas/CreditLine"

    CreditLineActionResponse:
      type: object
      required: [line, message]
      properties:
        line:
          $ref: "#/components/schemas/CreditLine"
        message:
          type: string
          example: "Credit line suspended."

    # ── Transaction Schemas ──────────────────────────────────────────────────

    Transaction:
      type: object
      required: [id, creditLineId, type, amount, currency, timestamp, metadata]
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
        creditLineId:
          type: string
          description: ID of the credit line this transaction belongs to
        type:
          type: string
          enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Transaction type
        amount:
          type: string
          nullable: true
          description: Transaction amount as a decimal string; null for status changes
          example: "500.00000000"
        currency:
          type: string
          nullable: true
          description: Currency code (e.g. USDC); null for status changes
          example: USDC
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the transaction occurred
        metadata:
          type: object
          additionalProperties: true
          description: Additional context; status changes include an 'action' field
          example:
            action: created

    TransactionHistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transactions, total, page, limit, totalPages]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            total:
              type: integer
              description: Total number of transactions matching the applied filters
            page:
              type: integer
              description: Current page number (1-indexed)
            limit:
              type: integer
              description: Maximum number of transactions per page
            totalPages:
              type: integer
              description: Total number of pages available

    # ── Risk Evaluation Schemas ───────────────────────────────────────────────

    RiskEvaluateRequest:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          description: Stellar wallet address to evaluate
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        forceRefresh:
          type: boolean
          description: Optional hint to bypass cache and recalculate risk
          default: false
      additionalProperties: false

    RiskEvaluateResponse:
      type: object
      required: [walletAddress, riskScore, creditLimit, interestRateBps, message]
      properties:
        walletAddress:
          type: string
          example: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
        riskScore:
          type: number
          description: Risk score (0-100)
          example: 72
        creditLimit:
          type: string
          description: Recommended credit limit
          example: "720.00000000"
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
          example: 640
        message:
          type: string
          example: "New risk evaluation completed"

    RiskEvaluateApiResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RiskEvaluateResponse"
        error:
          type: string
          nullable: true

    RiskEvaluation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique evaluation identifier
        walletAddress:
          type: string
          description: Evaluated wallet address
        riskScore:
          type: number
          description: Risk score (0-100)
        creditLimit:
          type: string
          description: Recommended credit limit
        interestRateBps:
          type: number
          description: Recommended interest rate in basis points
        factors:
          type: object
          additionalProperties: true
          description: Risk evaluation factors and weights
        evaluatedAt:
          type: string
          format: date-time
          description: ISO 8601 evaluation timestamp

    RiskEvaluationHistoryResponse:
      type: object
      required: [evaluations]
      properties:
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/RiskEvaluation"

    # ── Webhook Schemas ───────────────────────────────────────────────────────

    WebhookConfigResponse:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
          example: ["https://example.com/webhook"]
        maxRetries:
          type: integer
          example: 3
        initialBackoffMs:
          type: integer
          example: 1000
        backoffMultiplier:
          type: number
          example: 2.0
        timeoutMs:
          type: integer
          example: 10000
        configured:
          type: boolean
          example: true

    WebhookTestResponse:
      type: object
      properties:
        total:
          type: integer
        reachable:
          type: integer
        unreachable:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              reachable:
                type: boolean
              error:
                type: string
                nullable: true

    WebhookHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [active, disabled]
        urls:
          type: integer
          description: Number of configured webhook URLs
        maxRetries:
          type: integer
        timeoutMs:
          type: integer

    AdminRecalibrateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Risk model recalibration triggered"

    # ── Error Schemas (RFC 7807 problem+json) ─────────────────────────────────

    ProblemDetails:
      type: object
      description: |
        RFC 7807 problem details with Creditra taxonomy extensions.
        Content-Type: application/problem+json
      required: [type, title, status, detail, code, data, error]
      properties:
        type:
          type: string
          format: uri
          example: "https://docs.creditra.dev/problems/validation_failed"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Validation failed"
        code:
          type: string
          description: Stable machine-readable taxonomy code
          enum:
            - validation_failed
            - unauthorized
            - forbidden
            - not_found
            - duplicate_resource
            - version_conflict
            - invalid_state_transition
            - unique_constraint_violation
            - payload_too_large
            - unsupported_media_type
            - rate_limited
            - upstream_failure
            - upstream_timeout
            - service_unavailable
            - internal_error
        details:
          description: Non-sensitive field issues or context object
          oneOf:
            - type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
            - type: object
              additionalProperties: true
        resource:
          type: string
        retryAfter:
          type: integer
        data:
          nullable: true
        error:
          type: string
          description: Legacy envelope field (same text as detail)

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"

    ConflictProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
      properties:
        code:
          type: string
          enum:
            - duplicate_resource
            - version_conflict
            - invalid_state_transition
            - unique_constraint_violation
        status:
          type: integer
          enum: [409]

    ValidationErrorResponse:
      type: object
      required: [data, error, details]
      description: |
        Returned for Zod request-schema failures (body, query, or path params).
        Stable shape — never includes stack traces or internal exception text.
      properties:
        data:
          nullable: true
          example: null
        error:
          type: string
          enum: [Validation failed]
          example: Validation failed
        details:
          type: array
          items:
            type: object
            required: [field, message]
            additionalProperties: false
            properties:
              field:
                type: string
                description: Dotted path to the invalid field, or "(root)"
                example: walletAddress
              message:
                type: string
                example: walletAddress must be a valid Stellar address
      additionalProperties: false

    RateLimitErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
      properties:
        code:
          type: string
          enum: [rate_limited]
        status:
          type: integer
          enum: [429]
        retryAfter:
          type: integer

    # RFC 7807 problem+json for HTTP 409 conflicts (duplicate resources,
    # version mismatches, invalid state transitions). Content-Type is
    # application/problem+json. Sensitive identifiers (wallets, secrets) are
    # never included in detail/details.
    ConflictProblem:
      type: object
      required: [type, title, status, detail, code, data, error]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI (stable per `code`)
          example: "https://docs.creditra.dev/problems/duplicate_resource"
        title:
          type: string
          example: Conflict
        status:
          type: integer
          enum: [409]
          example: 409
        detail:
          type: string
          description: Human-readable explanation (no sensitive identifiers)
          example: "An open credit line already exists for this wallet. Close it before opening another."
        code:
          type: string
          description: Stable machine-readable code for client branching
          enum:
            - duplicate_resource
            - version_conflict
            - invalid_state_transition
            - unique_constraint_violation
          example: duplicate_resource
        resource:
          type: string
          description: Optional resource kind involved in the conflict
          enum:
            - credit_line
            - risk_evaluation
            - webhook_subscription
            - borrower
            - event
          example: credit_line
        details:
          type: object
          additionalProperties: true
          description: >
            Actionable, non-sensitive context only (field names, status enums).
            Never contains wallet addresses, API keys, or secrets.
          example:
            field: walletAddress
            existingStatus: active
        data:
          nullable: true
          description: Always null on error (legacy envelope compatibility)
        error:
          type: string
          description: Same text as `detail` (legacy envelope compatibility)

    WebhookSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute http(s) subscriber URL
          example: "https://example.com/hooks/creditra"
      additionalProperties: false

    WebhookSubscription:
      type: object
      required: [url, createdAt]
      properties:
        url:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: creditra-backend

  # ── Reconciliation Routes ───────────────────────────────────────────────────

  /api/reconciliation/trigger:
    post:
      tags: [Reconciliation]
      operationId: triggerReconciliation
      summary: Schedule a reconciliation job
      description: Admin-gated endpoint that schedules a DB-vs-chain reconciliation job and returns immediately.
      responses:
        "202":
          description: Reconciliation job scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationTriggerResponse"
              example:
                data:
                  jobId: "reconciliation-1710000000000"
                  message: Reconciliation job scheduled
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to schedule reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reconciliation/status:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationStatus
      summary: Get reconciliation worker and queue status
      description: Admin-gated endpoint for dashboards and alerts to inspect worker and queue health.
      responses:
        "200":
          description: Reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationStatusResponse"
              example:
                data:
                  workerRunning: true
                  queueSize: 0
                  failedJobs: 0
                error: null
        "401":
          description: Missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to get reconciliation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Credit Lines Routes ─────────────────────────────────────────────────────

  /api/credit/lines:
    get:
      tags: [Credit]
      operationId: listCreditLines
      summary: List all credit lines
      security: []
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset (offset mode; ignored when `cursor` is present)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Number of credit lines per page (validated by creditLinesQuerySchema)
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            When present (including empty string), switches to cursor pagination.
            Pass `nextCursor` from the previous page for subsequent pages.
      responses:
        "200":
          description: |
            Offset mode returns `{ data: { creditLines, pagination }, error: null }`.
            Cursor mode returns an unenveloped `{ creditLines, pagination }` body
            (see docs/cursor-pagination.md).
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window
              schema:
                type: integer
                example: 100
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema:
                type: integer
                example: 95
            X-RateLimit-Reset:
              description: Unix timestamp when the rate limit window resets
              schema:
                type: integer
                example: 1700000060
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLinesResponse"
              example:
                data:
                  creditLines: []
                  pagination:
                    total: 0
                    offset: 0
                    limit: 100
                error: null
        "400":
          description: Invalid query parameter (Zod validation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                example: 47
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    post:
      tags: [Credit]
      operationId: createCreditLine
      summary: Create a new credit line
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditLineRequest"
            example:
              walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
              requestedLimit: "1000.00"
      responses:
        "201":
          description: Credit line created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error or missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Duplicate open credit line for this wallet. Close the existing open
            line before opening another. Response is RFC 7807 problem+json with
            stable `code` `duplicate_resource` (or `unique_constraint_violation`).
            Sensitive identifiers are never included in `detail`/`details`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"
              example:
                type: "https://docs.creditra.dev/problems/duplicate_resource"
                title: Conflict
                status: 409
                detail: "An open credit line already exists for this wallet. Close it before opening another."
                code: duplicate_resource
                resource: credit_line
                details:
                  field: walletAddress
                  existingStatus: active
                data: null
                error: "An open credit line already exists for this wallet. Close it before opening another."

  /api/credit/lines/{id}:
    get:
      tags: [Credit]
      operationId: getCreditLineById
      summary: Get a credit line by ID
      description: |
        Returns a single credit line. Supports conditional GET via `ETag` /
        `If-None-Match` (see docs/etag-caching.md). The ETag is a content hash
        of the response envelope and changes whenever the line's state changes.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Credit line found
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "304":
          description: |
            Not Modified — the representation matching `If-None-Match` is still
            current. Body is empty; reuse the previously cached payload.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Credit line not found
                id: "abc123"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

    put:
      tags: [Credit]
      operationId: updateCreditLine
      summary: Update a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCreditLineRequest"
            example:
              creditLimit: "1500.00"
              interestRateBps: 640
              status: active
              expectedVersion: 3
      responses:
        "200":
          description: Credit line updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLine"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Optimistic-locking conflict. The supplied `expectedVersion` did not
            match the stored `version`, meaning a concurrent update won the
            race. Re-read the credit line to get the current `version` and
            retry the update with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Credit]
      operationId: deleteCreditLine
      summary: Delete a credit line
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "204":
          description: Credit line deleted successfully
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit/lines/{id}/transactions:
    get:
      tags: [Credit]
      operationId: getCreditLineTransactions
      summary: List transaction history for a credit line
      description: |
        Returns a paginated list of transactions for the given credit line.
        Supports optional filtering by transaction type and date range.

        Conditional GET is supported via `ETag` / `If-None-Match`. The ETag
        covers the filtered and paginated slice — different query strings
        produce different validators. See docs/etag-caching.md.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [borrow, repay, interest_accrual, fee, status_change]
          description: Filter by transaction type
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or after this ISO 8601 timestamp (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include only transactions at or before this ISO 8601 timestamp (inclusive)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of transactions per page
      responses:
        "200":
          description: Paginated list of transactions
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistoryResponse"
              example:
                data:
                  transactions:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      creditLineId: "line-abc"
                      type: status_change
                      amount: null
                      currency: null
                      timestamp: "2024-01-15T10:00:00.000Z"
                      metadata:
                        action: created
                  total: 1
                  page: 1
                  limit: 20
                  totalPages: 1
        "304":
          description: |
            Not Modified — transaction slice matching `If-None-Match` is still
            current. Body is empty.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlPrivateRevalidate"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Invalid type filter. Must be one of: borrow, repay, interest_accrual, fee, status_change."
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/credit/lines/{id}/suspend:
    post:
      tags: [Credit]
      operationId: suspendCreditLine
      summary: Suspend a credit line
      description: |
        Suspends the specified credit line, preventing further draws.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "200":
          description: Credit line suspended successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLineActionResponse"
        "401":
          description: API key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Forbidden
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Invalid state transition (e.g. suspend of already suspended/closed).
            RFC 7807 problem+json with `code: invalid_state_transition`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"

  /api/credit/lines/{id}/close:
    post:
      tags: [Credit]
      operationId: closeCreditLine
      summary: Close a credit line
      description: |
        Closes the specified credit line permanently.
        Requires API key authentication.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credit line identifier
      responses:
        "200":
          description: Credit line closed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditLineActionResponse"
        "401":
          description: API key missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Unauthorized
        "403":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Forbidden
        "404":
          description: Credit line not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Invalid state transition (e.g. close of already closed).
            RFC 7807 problem+json with `code: invalid_state_transition`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ConflictProblem"

  /api/credit/wallet/{walletAddress}/lines:
    get:
      tags: [Credit]
      operationId: getCreditLinesByWallet
      summary: Get credit lines for a specific wallet
      security: []
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
          description: Stellar wallet address
      responses:
        "200":
          description: Credit lines for the wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCreditLinesResponse"
              example:
                creditLines:
                  - id: "cl_abc123"
                    walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
                    creditLimit: "720.00000000"
                    currentBalance: "100.00000000"
                    availableCredit: "620.00000000"
                    interestRateBps: 640
                    status: active
                    createdAt: "2024-01-15T10:00:00.000Z"
                    updatedAt: "2024-01-15T10:00:00.000Z"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Risk Evaluation Routes ──────────────────────────────────────────────────

  /api/risk/evaluate:
    post:
      tags: [Risk]
      operationId: evaluateRisk
      summary: Evaluate on-chain risk for a wallet
      description: |
        Performs a fresh risk evaluation for the given Stellar wallet address.
        Rate limited: default 10 requests per minute per IP address.
        Configure via RATE_LIMIT_MAX_EVALUATE and RATE_LIMIT_WINDOW_MS env vars.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskEvaluateRequest"
            example:
              walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
              forceRefresh: false
      responses:
        "200":
          description: Risk evaluation result
          headers:
            X-RateLimit-Limit:
              description: Maximum requests allowed per window
              schema:
                type: integer
                example: 10
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the rate limit window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateApiResponse"
              example:
                data:
                  walletAddress: "GDRXE2BQUC3AZNPVFSCEZ76NJ3WWL25FYFK6RGZGIEKWE4SOUJ3LNLRK"
                  riskScore: 72
                  creditLimit: "720.00000000"
                  interestRateBps: 640
                  message: New risk evaluation completed
                error: null
        "400":
          description: Missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Validation failed
        "413":
          description: Request body exceeds the 100 kb limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                data: null
                error: Request body too large. Maximum size is 100kb.
        "415":
          description: Content-Type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                data: null
                error: Content-Type must be application/json

  /api/webhooks/config:
    get:
      tags: [Webhooks]
      operationId: getWebhookConfig
      summary: Get webhook configuration
      description: Returns the current webhook configuration (excluding sensitive data)
      security: []
      responses:
        "200":
          description: Webhook configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookConfigResponse"
              example:
                urls: ["https://example.com/webhook"]
                maxRetries: 3
                initialBackoffMs: 1000
                backoffMultiplier: 2.0
                timeoutMs: 10000
                configured: true

  /api/webhooks/test:
    post:
      tags: [Webhooks]
      operationId: testWebhooks
      summary: Test webhook connectivity
      description: Sends a test payload to all configured webhook endpoints
      security: []
      responses:
        "200":
          description: Test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookTestResponse"
              example:
                total: 2
                reachable: 1
                unreachable: 1
                results:
                  - url: "https://example.com/webhook"
                    reachable: true
                  - url: "https://test.com/hook"
                    reachable: false
                    error: "Connection refused"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks/health:
    get:
      tags: [Webhooks]
      operationId: getWebhookHealth
      summary: Webhook service health check
      description: Returns the health status of the webhook service
      security: []
      responses:
        "200":
          description: Webhook service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookHealthResponse"
              example:
                status: active
                urls: 2
                maxRetries: 3
                timeoutMs: 10000

  /api/risk/evaluations/{id}:
    get:
      tags: [Risk]
      operationId: getRiskEvaluationById
      summary: Fetch a stored risk evaluation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Risk evaluation identifier
      responses:
        "200":
          description: Risk evaluation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluation"
        "404":
          description: Risk evaluation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Risk evaluation not found
                id: "abc123"

  /api/risk/wallet/{walletAddress}/latest:
    get:
      tags: [Risk]
      operationId: getLatestRiskEvaluation
      summary: Get the latest risk evaluation for a wallet
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: Stellar public key
      responses:
        "200":
          description: Risk evaluation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskEvaluateResponse"
        "400":
          description: Invalid wallet address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No risk evaluation found for wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/risk/wallet/{walletAddress}/history:
    get:
      tags: [Risk]
      operationId: getRiskEvaluationHistory
      summary: Get risk evaluation history for a wallet
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
          description: Stellar public key
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Pagination offset
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Pagination limit
      responses:
        "200":
          description: Array of risk evaluations
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskEvaluation"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
